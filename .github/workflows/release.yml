# Builds a release artefact and the node image, and verifies the artefact with the code an operator's
# host runs. On a version tag it publishes them: a GitHub release with the artefact, its digest and
# the strategy library, and the image on the GitHub container registry. Otherwise both are kept as
# workflow artefacts only.

name: Release

# On demand once this file is on the default branch; until then, and whenever the release tooling
# changes, on a push to dev.
on:
  workflow_dispatch:
  push:
    tags: ['v*']
    branches: [dev]
    paths:
      - .github/workflows/release.yml
      - scripts/release/**
      - Dockerfile

permissions:
  contents: read

jobs:
  artefact:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The pin is read from rust-toolchain.toml and validated as a bare version, as in CI.
      - name: Read and validate the pinned toolchain
        id: pin
        run: |
          set -euo pipefail
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          case "$pinned" in
            *[!0-9.]* | "" | .* | *..* | *. )
              echo "Rejected toolchain '$pinned': not a bare version." >&2
              exit 1 ;;
          esac
          echo "rust=$pinned" >> "$GITHUB_OUTPUT"

      - name: Install the pinned Rust toolchain
        env:
          PINNED_RUST: ${{ steps.pin.outputs.rust }}
        run: |
          set -euo pipefail
          rustup toolchain install "$PINNED_RUST" --profile minimal
          rustup default "$PINNED_RUST"

      - name: Build the release programs
        run: cargo build --release --locked --workspace --bins

      - name: Assemble, record and verify the artefact
        id: assemble
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('crates/deployment/deployment.json'))['platform_version'])")
          name="bijective-${version}-linux-x86_64"
          bash scripts/release/assemble.sh release "dist/${name}"
          target/release/bijective-deploy verify-artefact "dist/${name}"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
          echo "name=${name}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ${{ steps.assemble.outputs.name }}
          path: |
            dist/${{ steps.assemble.outputs.name }}.tar.gz
            dist/${{ steps.assemble.outputs.name }}.tar.gz.sha256

  image:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build the node image
        run: docker build --tag bijective:candidate .

      - name: Save the image
        run: docker save bijective:candidate | gzip > bijective-image.tar.gz

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bijective-image
          path: bijective-image.tar.gz

  publish:
    # A tag publishes only the version the manifest declares, so a release cannot carry a number
    # its runbooks and artefact were not built for. Only the open-core repository publishes: a
    # private working copy of this file must never push an image under the public name.
    if: startsWith(github.ref, 'refs/tags/v') && github.repository == 'BijectiveLabs/bijective'
    needs: [artefact, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check the tag against the declared version
        id: version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version=$(python3 -c "import json; print(json.load(open('crates/deployment/deployment.json'))['platform_version'])")
          if [ "$TAG" != "v${version}" ]; then
            echo "Tag $TAG does not name the declared version ${version}." >&2
            exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist

      - name: Build the strategy library
        run: |
          set -euo pipefail
          python3 -m pip install --quiet build
          python3 -m build --outdir dist/python python/bijective-strategy

      - name: Extract the release notes
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          awk -v v="## ${VERSION}" '$0 == v {on = 1; next} /^## / {on = 0} on' RELEASES.md > notes.md
          [ -s notes.md ] || { echo "RELEASES.md has no section for ${VERSION}." >&2; exit 1; }

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --title "Bijective $TAG" --notes-file notes.md \
            dist/bijective-*-linux-x86_64/*.tar.gz dist/bijective-*-linux-x86_64/*.sha256 \
            dist/python/*

      - name: Publish the image
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/bijective"
          gunzip -c dist/bijective-image/bijective-image.tar.gz | docker load
          echo "$TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          docker tag bijective:candidate "${image}:${VERSION}"
          docker push "${image}:${VERSION}"
