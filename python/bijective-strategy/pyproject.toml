[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bijective-strategy"
version = "0.1.0"
description = "The protocol a strategy speaks, for strategies written in Python."
readme = "README.md"
license = "Apache-2.0"

requires-python = ">=3.12,<3.15"

# No dependencies: the strategy sandbox has no network, so this is standard library only.
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
