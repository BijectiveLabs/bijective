[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bijective-detection"
version = "0.1.0"
description = "Missing-event detection - read-side expectation registry and evaluator."
readme = "README.md"
license = "Apache-2.0"

# The Python floor is our own choice.
requires-python = ">=3.12,<3.15"

# No runtime dependencies: the registry is plain JSON and the loader does its own checks.
# Any added later passes the licence allow-list check in CI (OSS Adoption Policy P8).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
