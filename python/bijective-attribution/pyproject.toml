[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bijective-attribution"
version = "0.1.0"
description = "Execution quality attribution - read-side pipeline."
readme = "README.md"
license = "Apache-2.0"

# Runtime floor is our own choice.
requires-python = ">=3.12,<3.15"

# No runtime dependencies; any added later passes the licence allow-list in CI (OSS Adoption Policy P8).
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]
# Optional BSD-3-Clause pure-Python driver for the C4 store; the store choice is open.
postgres = ["pg8000>=1.31"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Warnings fail the run: in a component reporting money figures they are signal.
filterwarnings = ["error"]
