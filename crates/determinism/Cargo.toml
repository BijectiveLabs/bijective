# The determinism harness.
# Kept apart from clock, bus and store because the property belongs to none of them.

[package]
name = "bijective-determinism"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
publish = false
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
bijective-common = { path = "../common" }
bijective-event-store = { path = "../event_store" }

[lints.rust]
unsafe_code = "forbid"
