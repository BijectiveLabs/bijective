[package]
name = "bijective-venue"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
publish = false
license.workspace = true

[lib]
name = "bijective_venue"
crate-type = ["rlib"]

[dependencies]
bijective-common = { path = "../common" }
bijective-model = { path = "../model" }
bijective-lifecycle = { path = "../lifecycle" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_code = "forbid"
