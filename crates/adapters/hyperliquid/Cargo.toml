# Hyperliquid venue adapter.

[package]
name = "bijective-venue-hyperliquid"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
publish = false
license.workspace = true

[lib]
name = "bijective_venue_hyperliquid"
crate-type = ["rlib"]

[dependencies]
bijective-venue = { path = "../../venue" }
bijective-lifecycle = { path = "../../lifecycle" }
bijective-model = { path = "../../model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
bijective-venue-socket = { path = "../socket" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
# The feature set must match the attested closure; a wider set is unattested.
k256 = { version = "0.14", default-features = false, features = ["ecdsa", "std"] }
sha3 = "0.10"
# Primitive writers only, no derive: field order changes every signature, and the venue
# reports a bad signature as a missing account.
rmp = { version = "0.8", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "http2"] }
bijective-secrets-broker = { path = "../../secrets_broker" }
bijective-common = { path = "../../common" }

[dev-dependencies]
sockudo-ws = { version = "3.1.1", default-features = false, features = ["tokio-runtime", "getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"
