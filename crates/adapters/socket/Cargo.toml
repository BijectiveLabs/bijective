# The one websocket client every venue adapter connects through: TLS from the host's roots and
# permessage-deflate when the venue accepts it, so a venue's stream fits a narrow link.

[package]
name = "bijective-venue-socket"
version = "0.1.1"
edition = "2024"
rust-version = "1.97.1"
publish = false
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
bytes = "1"
futures-util = { version = "0.3", features = ["sink"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
sockudo-ws = { version = "3.1.1", default-features = false, features = ["tokio-runtime", "permessage-deflate", "getrandom"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "io-util"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
url = "2"

[lints.rust]
unsafe_code = "forbid"

[dev-dependencies]
bijective-common = { path = "../../common" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-util"] }
