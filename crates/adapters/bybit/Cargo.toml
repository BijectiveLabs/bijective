# First venue adapter, lifted from prior work without its f64 math or Redis/PyO3 coupling.
# Transport is a state machine that opens nothing; only the socket needs a venue.

[package]
name = "bijective-venue-bybit"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false
license.workspace = true

[lib]
crate-type = ["rlib"]

[dependencies]
bijective-lifecycle = { path = "../../lifecycle" }
bijective-model = { path = "../../model" }
bijective-common = { path = "../../common" }
bijective-venue = { path = "../../venue" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "macros", "sync"] }
bijective-venue-socket = { path = "../socket" }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = "0.3"
hmac = "0.13"
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls-no-provider", "http2"] }
bijective-secrets-broker = { path = "../../secrets_broker" }
sha2 = "0.11"

[dev-dependencies]
sockudo-ws = { version = "3.1.1", default-features = false, features = ["tokio-runtime", "getrandom"] }
bijective-venue-simulated = { path = "../simulated" }
# Drill-only dependency: a drill may reach where a shipped component may not.
bijective-venue-assurance = { path = "../../venue_assurance" }
bijective-event-store = { path = "../../event_store" }
bijective-reconciliation = { path = "../../reconciliation" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync"] }

[lints.rust]
unsafe_code = "forbid"
